# 三條 gate 加正式版冒煙測試，在 macOS 與 Windows 各跑一次。
# 記錄人用的電腦兩個平台都有，只在 macOS 上驗等於每次改碼都在猜 Windows。
# Node 24 對齊桌面 app 打包的 Electron 內建的 Node（Electron 44.4.5 帶 Node 24.21）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只有發版的三個 job（release、desktop、update-bundle）要寫 Release 與 tag，各自另開 contents: write
permissions:
  contents: read

jobs:
  # 本機 hook 只在設定過的 clone 生效，GitHub 網頁 merge、fork 送來的 commit 都不經過它。
  # 這裡每次掃 HEAD 的整段祖先（改動與 commit message，兩步範圍一致，不掃 origin 上別的分支），
  # gitleaks 釘版本並驗官方 checksum，值一律遮掉。merge commit 要帶 --diff-merges=first-parent：
  # git log -p 預設不印 merge 的 diff，解衝突時貼進去的內容（GitHub 網頁 Resolve conflicts）會漏掉。
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安裝 gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: 掃歷史裡的改動
        run: ./gitleaks git -v --redact --no-banner --log-opts="HEAD --diff-merges=first-parent" .
      - name: 掃 commit message（一個 commit 一次，紅了才知道是哪一個）
        run: |
          bad=0
          for c in $(git rev-list HEAD); do
            if ! git log -1 --format=%B "$c" | ./gitleaks stdin --redact --no-banner --log-level error; then
              echo "commit $c 的 message 有疑似密鑰"
              bad=1
            fi
          done
          exit $bad

  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # 拿掉 devDependencies 之後再啟動一次，守 dist/server.cjs 不依賴 vite 這類開發工具
      - run: npm prune --omit=dev
      - run: node scripts/smokeProduction.mjs

  # 發版（安裝檔與更新清單放 GitHub Release，不用 artifact：artifact 吃帳號的儲存額度，2026-10 撞滿過，Release 不算在內）。
  # package.json 這一版還沒有 tag，就要有 CHANGELOG.md 的那一段，PR 上就驗，升版忘了寫說明在 PR 就紅。
  # main 上再決定這次發不發，結果（mode）給 desktop 與 update-bundle：
  #   - 已發布的 Release 已在 → skip，不動它
  #   - draft 已在、target 是這個 commit → resume：同一個 commit 重跑，接著傳、覆蓋 draft 上的檔
  #   - draft 已在、target 是別的 commit → skip：同版本的另一次 push 正在發或發失敗了，要用這個 commit 發，先刪 draft 再重跑
  #   - 沒有 Release 但 tag 已在 → skip：v0.2.0 這種當時手打 tag 的版本，main 已多了之後的碼，照建版本號會跟內容對不上
  #   - 都沒有 → create：建 draft
  # 傳檔期間一直是 draft，兩平台的安裝檔與清單都傳完、tag 建好才轉成發布，看得到的 Release 不會少檔案。
  # 同一個 ref 的 release job 一次只跑一個：兩次 main push 隔幾秒的話，兩邊都還沒看到對方的 draft，會建出兩個同名 draft
  release:
    needs: gate
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 這一版有沒有 tag
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          tagged=$(git ls-remote --tags origin "refs/tags/$tag")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tagged" ]; then echo "tagged=true" >> "$GITHUB_OUTPUT"; else echo "tagged=false" >> "$GITHUB_OUTPUT"; fi
      - name: 版本說明（CHANGELOG.md）
        if: steps.version.outputs.tagged == 'false'
        run: npx tsx scripts/releaseNotes.ts > tag-message.txt
      - name: 這次發不發
        id: decide
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TAGGED: ${{ steps.version.outputs.tagged }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.draft) \(.target_commitish)\"")
          n=0; [ -n "$found" ] && n=$(printf '%s\n' "$found" | wc -l)
          if [ "$n" -gt 1 ]; then
            echo "::error::$TAG 有 $n 個 Release（含 draft），只能有一個，到 Releases 頁刪掉多的再重跑"
            exit 1
          elif [ "$n" -eq 1 ]; then
            read -r draft target <<< "$found"
            if [ "$draft" = false ]; then
              mode=skip; echo "$TAG 已發布，不動它"
            elif [ "$target" = "$GITHUB_SHA" ]; then
              mode=resume; echo "$TAG 的 draft 是這個 commit 建的，接著傳"
            else
              mode=skip; echo "::warning::$TAG 的 draft 是 commit $target 建的，不是這次的 $GITHUB_SHA。要用這個 commit 發：gh release delete $TAG --yes，再 Re-run all jobs"
            fi
          elif [ "$TAGGED" = true ]; then
            mode=skip; echo "::notice::$TAG 已有 tag 沒有 Release，不建（main 可能已多了那版之後的碼）"
          else
            mode=create
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: 建 draft Release
        if: steps.decide.outputs.mode == 'create'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tail -n +3 tag-message.txt > release-notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$(head -n1 tag-message.txt)" --notes-file release-notes.md

  # 桌面 app：兩個平台各自打包、真的把 app 啟動起來確認裡面的 server 有回應，再產出安裝檔。
  # Windows 上的外殼（utilityProcess、檔案佈局、cwd）能不能跑，只有這一步驗得到。
  # 安裝檔沒有簽章（vault plan 的裁定），macOS 要關掉自動找簽章身分，不然 electron-builder 會去翻 keychain。
  desktop:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dir-args: --mac dir --arm64
            exe: release/mac-arm64/MeetPilot.app/Contents/MacOS/MeetPilot
            bundled-ffmpeg: release/mac-arm64/MeetPilot.app/Contents/Resources/ffmpeg
            dist-args: --mac
            artifact: release/*.dmg
          - os: windows-latest
            dir-args: --win dir --x64
            exe: release/win-unpacked/MeetPilot.exe
            bundled-ffmpeg: release/win-unpacked/resources/ffmpeg
            dist-args: --win
            artifact: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 隨附的最小 ffmpeg（E2）：原始碼固定版本、驗 sha256 與官方簽章，編完用測試音檔跑過才准打包。
      # 快取鍵是建置腳本與 configure 參數的雜湊，改了參數就重編
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg/**') }}
      - name: build ffmpeg (macOS arm64 + x64)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_REQUIRE_SIGNATURE: '1'
        run: |
          command -v gpg || brew install gnupg
          bash scripts/ffmpeg/build.sh mac-arm64
          bash scripts/ffmpeg/build.sh mac-x64
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-binutils
            make diffutils tar xz curl gnupg
      - name: build ffmpeg (Windows x64)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          FFMPEG_REQUIRE_SIGNATURE: '1'
        run: bash scripts/ffmpeg/build.sh win-x64
      - name: verify ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tsx scripts/verifyFfmpeg.ts vendor/ffmpeg/mac-arm64/ffmpeg vendor/ffmpeg/mac-arm64/ffprobe
          # x64 版在 Apple Silicon 的 runner 上靠 Rosetta 跑；跑不起來就失敗，不跳過
          npx tsx scripts/verifyFfmpeg.ts vendor/ffmpeg/mac-x64/ffmpeg vendor/ffmpeg/mac-x64/ffprobe
      - name: verify ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: npx tsx scripts/verifyFfmpeg.ts vendor/ffmpeg/win-x64/ffmpeg.exe vendor/ffmpeg/win-x64/ffprobe.exe
      - run: npm run build
      - run: npm run build:electron
      - run: npx electron-builder ${{ matrix.dir-args }} --publish never
      - run: node scripts/smokeDesktop.mjs ${{ matrix.exe }}
      # 打包後那一份 ffmpeg 也實際跑一次：權限、檔案有沒有被完整打進去，只看 log 裡的路徑驗不到
      - name: verify bundled ffmpeg
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          npx tsx scripts/verifyFfmpeg.ts "${{ matrix.bundled-ffmpeg }}/ffmpeg$ext" "${{ matrix.bundled-ffmpeg }}/ffprobe$ext"
      # release job 過了就打包，PR 上也打（守打包設定），只有 release job 判定要發的那次才傳上 draft Release。
      # 不用 artifact：artifact 吃帳號的儲存額度，2026-10-12 撞滿後每次 CI 的 desktop 兩格都紅在上傳，程式碼全過也一樣
      - run: npx electron-builder ${{ matrix.dist-args }} --publish never
      - if: needs.release.outputs.mode == 'create' || needs.release.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" ${{ matrix.artifact }} --clobber

  # 兩個平台的安裝檔整理成一份更新清單（E5）：meetpilot-update.json（版本、每個平台的檔名、大小、sha512），傳回同一個 Release。
  # 安裝檔從 draft 下載回來算，清單對的就是 Release 上那幾個檔。少了任何一個平台、或安裝檔版本跟 package.json 不一樣，
  # 這一步就紅，Release 停在 draft、不發布。都過了才建 annotated tag（訊息是 CHANGELOG.md 那一段）再轉成發布。
  # admin 從 Release 下載兩個 dmg、一個 exe、meetpilot-update.json，放進 OneDrive 的 MeetPilot 記錄/_更新/，舊版的檔案刪掉
  update-bundle:
    needs: [release, desktop]
    if: needs.release.outputs.mode == 'create' || needs.release.outputs.mode == 'resume'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 只拿安裝檔：resume 時 draft 上可能已有上一次傳的清單
      - run: gh release download "$TAG" --pattern 'MeetPilot-*.dmg' --pattern 'MeetPilot-*.exe' --dir installers
      - run: npx tsx scripts/writeUpdateBundle.ts --out update-bundle installers
      - run: gh release upload "$TAG" update-bundle/meetpilot-update.json --clobber
      # resume 時 tag 可能已在（上一次建完 tag、發布前失敗）：指在這個 commit 就沿用，指在別的 commit 就紅
      - name: 建 annotated tag
        run: |
          peeled=$(git ls-remote origin "refs/tags/$TAG^{}")
          if [ -n "$peeled" ]; then
            if [ "${peeled%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG 已指在 ${peeled%%[[:space:]]*}，不是這次的 $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG 已指在這個 commit，沿用"
          else
            npx tsx scripts/releaseNotes.ts > tag-message.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -F tag-message.txt "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - run: gh release edit "$TAG" --draft=false
